<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Subtle entry animations
            const main = document.querySelector('main');
            main.classList.add('opacity-0', 'translate-y-4');
            setTimeout(() => {
                main.classList.add('transition-all', 'duration-700', 'ease-out');
                main.classList.remove('opacity-0', 'translate-y-4');
            }, 100);

            // Active button scale effect
            const buttons = document.querySelectorAll('button, a');
            buttons.forEach(btn => {
                btn.addEventListener('touchstart', () => {
                    btn.classList.add('scale-95');
                });
                btn.addEventListener('touchend', () => {
                    btn.classList.remove('scale-95');
                });
            });

            // Smooth cross-fade logic for links
            document.querySelectorAll('a[href^="{{DATA:SCREEN:"]').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const target = link.getAttribute('href');
                    document.body.style.opacity = '0';
                    setTimeout(() => {
                        window.location.href = target;
                    }, 400);
                });
            });
        });
    </script>
