<html class="light" lang="en"><head>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<body class="bg-background text-on-background font-body-md selection:bg-secondary-container">
<div class="w-full max-w-md min-h-screen bg-background relative flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-background">
<div class="flex justify-between items-center px-margin-mobile py-4 max-w-container-max mx-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary">waves</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary uppercase tracking-widest">FĒMME</h1>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary">account_circle</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-container-max mx-auto px-margin-mobile lg:px-margin-desktop pb-32 pt-4">
<!-- Header Section -->
<section class="observe-in mb-10">
<p class="font-label-sm text-label-sm text-secondary uppercase tracking-widest mb-2">Wednesday, May 24</p>
<h2 class="word-animate font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">3. Today Feed</h2>
</section>
<!-- Masonry Feed -->
<div class="masonry-grid">
<!-- Card 1: Food/Nutrition -->
<div class="card-hover observe-in masonry-item group cursor-pointer overflow-hidden rounded-lg" data-delay="1">
<div class="relative w-full aspect-[3/4] overflow-hidden rounded-lg bg-surface-container">
<img class="observe-image w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="A high-end editorial food photograph of a vibrant green morning smoothie bowl topped with fresh berries and seeds. The scene is bathed in soft, natural morning light on a rustic stone table in a bright minimalist kitchen. The aesthetic is clean and serene, reflecting a premium wellness lifestyle with soft shadows and organic textures." src="https://picsum.photos/seed/femme07/400/500"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 via-transparent to-transparent opacity-60 group-hover:opacity-80 transition-opacity"></div>
<div class="absolute bottom-6 left-6 right-6">
<span class="font-label-sm text-label-sm text-on-primary/80 uppercase mb-1 block">07:30 AM</span>
<h3 class="font-headline-md text-headline-md text-on-primary">Nourish</h3>
</div>
</div>
</div>
<!-- Card 2: Movement -->
<div class="card-hover observe-in masonry-item group cursor-pointer overflow-hidden rounded-lg" data-delay="2">
<div class="relative w-full aspect-square overflow-hidden rounded-lg bg-surface-container">
<img class="observe-image w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="Minimalist yoga scene featuring a person in a calm stretch on a cream-colored mat in a sun-drenched studio with high ceilings. The lighting is ethereal and diffused, creating a peaceful atmosphere. Neutral tones dominate the palette, emphasizing a clean, modern lifestyle aesthetic and mindful movement." src="https://picsum.photos/seed/femme08/400/500"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 via-transparent to-transparent opacity-60"></div>
<div class="absolute bottom-6 left-6 right-6">
<span class="font-label-sm text-label-sm text-on-primary/80 uppercase mb-1 block">08:15 AM</span>
<h3 class="font-headline-md text-headline-md text-on-primary">Flow State</h3>
</div>
</div>
</div>
<!-- Card 3: Rituals/Journaling -->
<div class="card-hover observe-in masonry-item group cursor-pointer overflow-hidden rounded-lg" data-delay="3">
<div class="relative w-full aspect-[4/5] overflow-hidden rounded-lg bg-surface-container">
<img class="observe-image w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="An artistic overhead shot of an open journal and a high-end fountain pen on a light wood desk next to a ceramic cup of matcha. Large windows nearby cast long, elegant shadows across the workspace. The mood is contemplative and sophisticated, focusing on the tactile nature of morning reflection and intention setting." src="https://picsum.photos/seed/femme09/400/500"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 via-transparent to-transparent opacity-60"></div>
<div class="absolute bottom-6 left-6 right-6">
<span class="font-label-sm text-label-sm text-on-primary/80 uppercase mb-1 block">09:00 AM</span>
<h3 class="font-headline-md text-headline-md text-on-primary">Intentions</h3>
</div>
</div>
</div>
<!-- Card 4: Rituals/Nature -->
<div class="card-hover observe-in masonry-item group cursor-pointer overflow-hidden rounded-lg" data-delay="4">
<div class="relative w-full aspect-[2/3] overflow-hidden rounded-lg bg-surface-container">
<img class="observe-image w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="A serene landscape view of a misty forest walk at dawn. Soft rays of sunlight pierce through the tall pines, illuminating the forest floor. The color palette is composed of deep forest greens, earthy browns, and soft golden light. The overall feel is quiet, grounded, and revitalizing, capturing the essence of morning connection with nature." src="https://picsum.photos/seed/femme10/400/500"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 via-transparent to-transparent opacity-60"></div>
<div class="absolute bottom-6 left-6 right-6">

</div>
</div>
</div>
<!-- Card 5: Food/Lunch -->
<div class="card-hover observe-in masonry-item group cursor-pointer overflow-hidden rounded-lg" data-delay="5">
<div class="relative w-full aspect-video overflow-hidden rounded-lg bg-surface-container">
<img class="observe-image w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="A beautifully plated seasonal salad with colorful vegetables and edible flowers on a minimalist ceramic plate. The image is crisp and vibrant, with high-key lighting that emphasizes the freshness of the ingredients. The setting is a bright, upscale dining space with a contemporary aesthetic and clean lines." src="https://picsum.photos/seed/femme11/400/500"/>

</div>
</div>

<!-- Card 6: Work/Focus -->
<div class="card-hover observe-in masonry-item group cursor-pointer overflow-hidden rounded-lg" data-delay="6">
<div class="relative w-full aspect-square overflow-hidden rounded-lg bg-surface-container">
<img class="observe-image w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" data-alt="A minimalist home office setup featuring a sleek laptop, a single monstera leaf in a glass vase, and a high-end designer chair. The workspace is bathed in clean, cool natural light from a large window. The atmosphere is one of focused productivity and organized calm, using a palette of whites, grays, and natural wood tones." src="https://picsum.photos/seed/femme12/400/500"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 via-transparent to-transparent opacity-60"></div>
<div class="absolute bottom-6 left-6 right-6">
<span class="font-label-sm text-label-sm text-on-primary/80 uppercase mb-1 block">02:00 PM</span>
<h3 class="font-headline-md text-headline-md text-on-primary">Deep Work</h3>
</div>
</div>
</div>
</div>
</main>
<!-- Floating Action Button: Morning Check-in -->
<div class="fixed bottom-28 left-1/2 -translate-x-1/2 z-50">
<button type="button" class="btn-spring bg-primary text-on-primary px-8 py-4 rounded-full flex items-center gap-3 shadow-xl hover:scale-105 active:scale-95 transition-all duration-300 group">
<span class="material-symbols-outlined text-[20px]">auto_awesome</span>
<span class="font-label-md text-label-md">Morning Check-in</span>
</button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-8 left-0 right-0 z-50 flex justify-center items-center px-4 pointer-events-none">
<div class="bg-surface-container-low/90 backdrop-blur-md w-[90%] md:w-[400px] rounded-full flex justify-around items-center p-2 pointer-events-auto">
<!-- The Briefing -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined mb-1">dashboard</span>
<span class="font-label-sm text-label-sm">The Briefing</span>
</a>
<!-- Today (Active) -->
<a class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-full px-6 py-2 transition-all duration-300 active:scale-90" href="#">
<span class="material-symbols-outlined mb-1">auto_awesome</span>
<span class="font-label-sm text-label-sm">Today</span>
</a>
<!-- Rituals -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined mb-1">self_care</span>
<span class="font-label-sm text-label-sm">Rituals</span>
</a>
<!-- Progress -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined mb-1">analytics</span>
<span class="font-label-sm text-label-sm">Progress</span>
</a>
</div>
</nav>
<script>
        // Micro-interactions for masonry items
        document.querySelectorAll('.masonry-item').forEach(item => {
            item.addEventListener('touchstart', function() {
                this.classList.add('scale-[0.98]');
            });
            item.addEventListener('touchend', function() {
                this.classList.remove('scale-[0.98]');
            });
        });

        // Simple scroll observer to fade in items
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        document.querySelectorAll('.masonry-item').forEach(item => {
            item.style.opacity = '0';
            item.style.transform = 'translateY(20px)';
            item.style.transition = 'all 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
            observer.observe(item);
        });
    </script>
<script src="shared/animations.js"></script>
</div>
</body></html>
