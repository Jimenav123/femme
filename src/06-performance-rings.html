<!-- Streak -->

<div class="flex gap-1 mt-2">

<div class="w-full bg-secondary h-1 rounded-full"></div>

</div>
<script>
        const CIRC_RECOVERY = 439.8;
        const CIRC_TRAINING = 565.5;
        const CIRC_NUTRITION = 691.1;

        function updateRings(nutritionPct, trainingPct, recoveryPct) {
            const nutritionOffset = CIRC_NUTRITION - (nutritionPct / 100) * CIRC_NUTRITION;
            const trainingOffset = CIRC_TRAINING - (trainingPct / 100) * CIRC_TRAINING;
            const recoveryOffset = CIRC_RECOVERY - (recoveryPct / 100) * CIRC_RECOVERY;

            document.getElementById('ring-nutrition').style.strokeDashoffset = nutritionOffset;
            document.getElementById('ring-training').style.strokeDashoffset = trainingOffset;
            document.getElementById('ring-recovery').style.strokeDashoffset = recoveryOffset;

            document.getElementById('metric-nutrition').innerText = nutritionPct;
            document.getElementById('metric-recovery').innerText = recoveryPct;
            
            let loadText = "Low";
            if(trainingPct > 80) loadText = "Optimal";
            else if(trainingPct > 50) loadText = "Moderate";
            document.getElementById('metric-training').innerText = loadText;

            const avg = Math.round((nutritionPct + trainingPct + recoveryPct) / 3);
            document.getElementById('center-score').innerText = avg;
        }

        window.onload = () => {
            setTimeout(() => updateRings(85, 92, 78), 100);
        };
    </script>
<script src="shared/animations.js"></script>
